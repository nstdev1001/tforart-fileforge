[package]
name = "fileforge"
version = "0.2.2"
description = "Tforart FileForge - Task manager and file automation desktop application"
authors = ["Tforart contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "fileforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
dotenvy = "0.15"
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dotenvy = "0.15"
fs2 = "0.4"
keyring = "4.1"
oauth2 = "5"
notify = "8.2"
open = "5.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "system-proxy"] }
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-notification = "2.3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.13"
